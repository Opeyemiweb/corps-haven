<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placements — Corps Haven</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<script src="loader.js"></script>

<header class="site-header">
  <a class="brand" href="index.html">Corps Haven</a>
  <button class="nav-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="Toggle menu">☰</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="housing.html">Housing</a>
    <a href="placements.html" class="active">Placements</a>
    <a href="submit.html">Submit</a>
  </nav>
</header>

<main>
  <div class="section-heading">Placements</div>
  <p class="section-sub">Companies open to hosting corps members — reach out directly.</p>
  <div id="list"><p class="loading">Loading placements…</p></div>
</main>

<footer>Corps Haven — a community board for NYSC corps members.</footer>

<script src="config.js"></script>
<script>
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const BRIEFCASE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>`;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  async function loadPlacements() {
    const el = document.getElementById("list");
    const { data, error } = await client
      .from("placements")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      el.innerHTML = `<p class="empty">Couldn't load placements: ${error.message}</p>`;
      return;
    }
    if (!data.length) {
      el.innerHTML = `<p class="empty">No approved placements yet. Check back soon, or <a href="submit.html">submit one</a>.</p>`;
      return;
    }
    el.innerHTML = data.map(item => `
      <div class="listing-row">
        <div class="listing-icon">${BRIEFCASE_ICON}</div>
        <div>
          <h3>${escapeHtml(item.company_name)}</h3>
          <p class="tag-line">${escapeHtml(item.industry)} · ${escapeHtml(item.area)}</p>
          <p class="desc">${escapeHtml(item.role_description)}</p>
          ${item.requirements ? `<p class="desc"><strong>Requirements:</strong> ${escapeHtml(item.requirements)}</p>` : ""}
        </div>
        <div>
          <div class="contact">${item.contact_phone ? escapeHtml(item.contact_phone) : ""}</div>
          <div class="contact">${item.contact_email ? escapeHtml(item.contact_email) : ""}</div>
        </div>
      </div>
    `).join("");
  }

  loadPlacements();
</script>

</body>
</html>
