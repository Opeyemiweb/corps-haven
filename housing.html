<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housing — Corps Haven</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js"></script>
</head>
<body>

<script src="loader.js"></script>

<header class="site-header">
  <a class="brand" href="index.html">Corps Haven</a>
  <button class="nav-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="Toggle menu">☰</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="housing.html" class="active">Housing</a>
    <a href="placements.html">Placements</a>
    <a href="submit.html">Submit</a>
  </nav>
</header>

<main>
  <div class="section-heading">Housing listings</div>
  <p class="section-sub">Reviewed and approved — reach out directly using the contact shown.</p>
  <div id="list"><p class="loading">Loading listings…</p></div>
</main>

<footer>Corps Haven — a community board for NYSC corps members.</footer>

<script src="config.js"></script>
<script>
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const HOUSE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V15a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10"/></svg>`;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  async function loadHousing() {
    const el = document.getElementById("list");
    const { data, error } = await client
      .from("housing_listings")
      .select("*")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      el.innerHTML = `<p class="empty">Couldn't load listings: ${error.message}</p>`;
      return;
    }
    if (!data.length) {
      el.innerHTML = `<p class="empty">No approved housing listings yet. Check back soon, or <a href="submit.html">submit one</a>.</p>`;
      return;
    }
    el.innerHTML = data.map(item => `
      <div class="listing-row">
        ${item.image_url
          ? `<img class="listing-thumb" src="${escapeHtml(item.image_url)}" alt="">`
          : `<div class="listing-icon">${HOUSE_ICON}</div>`
        }
        <div>
          <h3>${escapeHtml(item.title)}</h3>
          <p class="tag-line">${escapeHtml(item.area)} · ${escapeHtml(item.house_type)}</p>
          <p class="desc">${escapeHtml(item.description || "")}</p>
        </div>
        <div>
          <div class="price">₦${Number(item.price).toLocaleString()}</div>
          <div class="contact">${escapeHtml(item.contact_phone)}</div>
        </div>
      </div>
    `).join("");
  }

  loadHousing();
</script>

</body>
</html>
