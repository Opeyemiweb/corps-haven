<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corps Haven — Admin</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #app-view { display: none; }
  main { max-width: 760px; }
  .section-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--forest); margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>

<script src="loader.js"></script>

<div id="login-view">
  <h2>Corps Haven admin</h2>
  <input id="email" type="email" placeholder="Admin email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Log in</button>
  <div id="login-error"></div>
</div>

<div id="app-view">
  <header class="site-header admin-header">
    <span class="brand">Corps Haven — Pending Approvals</span>
    <button onclick="logout()">Log out</button>
  </header>
  <main>
    <div class="section-label">Housing listings</div>
    <div id="housing-list"><p class="empty">Loading…</p></div>

    <div class="section-label">Placements</div>
    <div id="placements-list"><p class="empty">Loading…</p></div>
  </main>
</div>

<script src="config.js"></script>
<script>
  // Reads SUPABASE_URL and SUPABASE_ANON_KEY from config.js
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";

    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = "Login failed: " + error.message;
      return;
    }
    showApp();
  }

  async function logout() {
    await client.auth.signOut();
    document.getElementById("app-view").style.display = "none";
    document.getElementById("login-view").style.display = "block";
  }

  async function showApp() {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("app-view").style.display = "block";
    await Promise.all([loadHousing(), loadPlacements()]);
  }

  async function loadHousing() {
    const el = document.getElementById("housing-list");
    const { data, error } = await client
      .from("housing_listings")
      .select("*")
      .eq("status", "pending")
      .order("created_at", { ascending: false });

    if (error) {
      el.innerHTML = `<p class="empty">Couldn't load housing listings: ${error.message}</p>`;
      return;
    }
    if (!data.length) {
      el.innerHTML = `<p class="empty">No pending housing listings.</p>`;
      return;
    }
    el.innerHTML = data.map(item => `
      <div class="card" id="housing-${item.id}">
        <h3>${escapeHtml(item.title)}</h3>
        <p>${escapeHtml(item.area)} · ${escapeHtml(item.house_type)} · ₦${Number(item.price).toLocaleString()}</p>
        <p>${escapeHtml(item.description || "")}</p>
        <div class="meta">Contact: ${escapeHtml(item.contact_phone)}</div>
        ${item.reviewed_by ? `<div class="meta">Last reviewed by ${escapeHtml(item.reviewed_by)}</div>` : ""}
        <div class="actions">
          <button class="approve" onclick="reviewItem('housing','${item.id}','approved','housing-${item.id}')">Approve</button>
          <button class="reject" onclick="reviewItem('housing','${item.id}','rejected','housing-${item.id}')">Reject</button>
        </div>
      </div>
    `).join("");
  }

  async function loadPlacements() {
    const el = document.getElementById("placements-list");
    const { data, error } = await client
      .from("placements")
      .select("*")
      .eq("status", "pending")
      .order("created_at", { ascending: false });

    if (error) {
      el.innerHTML = `<p class="empty">Couldn't load placements: ${error.message}</p>`;
      return;
    }
    if (!data.length) {
      el.innerHTML = `<p class="empty">No pending placements.</p>`;
      return;
    }
    el.innerHTML = data.map(item => `
      <div class="card" id="placement-${item.id}">
        <h3>${escapeHtml(item.company_name)}</h3>
        <p>${escapeHtml(item.industry)} · ${escapeHtml(item.area)}</p>
        <p>${escapeHtml(item.role_description)}</p>
        <div class="meta">${escapeHtml(item.contact_phone || "")} ${item.contact_email ? "· " + escapeHtml(item.contact_email) : ""}</div>
        ${item.reviewed_by ? `<div class="meta">Last reviewed by ${escapeHtml(item.reviewed_by)}</div>` : ""}
        <div class="actions">
          <button class="approve" onclick="reviewItem('placement','${item.id}','approved','placement-${item.id}')">Approve</button>
          <button class="reject" onclick="reviewItem('placement','${item.id}','rejected','placement-${item.id}')">Reject</button>
        </div>
      </div>
    `).join("");
  }

  async function reviewItem(kind, id, status, cardId) {
    let reason = null;
    if (status === "rejected") {
      reason = prompt("Reason for rejecting (shown in your own records only):", "");
      if (reason === null) return; // user cancelled
    }

    const fn = kind === "housing" ? "review_housing" : "review_placement";
    const { error } = await client.rpc(fn, {
      p_id: id,
      p_status: status,
      p_reason: reason
    });

    if (error) {
      alert("Update failed: " + error.message);
      return;
    }
    document.getElementById(cardId).remove();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  // Resume session on reload
  client.auth.getSession().then(({ data }) => {
    if (data.session) showApp();
  });
</script>
</body>
</html>
